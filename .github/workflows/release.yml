name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked || cargo build --release
      - name: Package
        run: |
          name=dyode-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}
          mkdir -p "$name/target/release"
          cp target/release/dyode "$name/target/release/"
          cp -r install.sh config.example.yaml packaging README.md CAVEATS.md CHANGELOG.md LICENSE docs "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dyode-*.tar.gz*
